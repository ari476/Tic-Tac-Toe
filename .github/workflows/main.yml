name: "PR Title Check"

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  check_pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title with custom regex
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;

            const regex = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+/i;

            if (!regex.test(title)) {
              core.setFailed(`
              ❌ Invalid PR title: "${title}"

              Your PR title must follow **Conventional Commits**:

                <type>(optional_scope): description

              Examples:
                - feat: add new login screen
                - fix(auth): prevent refresh loop
              `);
            } else {
              console.log("✅ PR title is valid");
            }
