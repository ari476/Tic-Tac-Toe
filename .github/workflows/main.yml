name: "PR Title Check"

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  check_pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title with regex
        uses: mheap/github-action-required-labels@v3
        with:
          title-regex: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'
          title-regex-flags: 'i'
          title-regex-fail-message: |
            ❌ Invalid PR title.

            Your PR title must follow **Conventional Commits**:

            ```
            <type>(optional_scope): description
            ```

            Examples:
            - feat: add new login screen
            - fix(auth): prevent refresh loop
